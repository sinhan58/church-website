<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<script>if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }</script>
<!-- 글씨체 준비될 때까지 잠깐 화면 숨기기 (최대 0.8초) -->
<script>document.documentElement.classList.add('fonts-loading');</script>
<style>
  html.fonts-loading body { opacity: 0; }
  body { transition: opacity 0.25s ease; }
</style>
<script>
(function () {
  var done = false;
  function reveal() {
    if (done) return;
    done = true;
    document.documentElement.classList.remove('fonts-loading');
  }
  function waitForLinkLoad(link) {
    return new Promise(function (resolve) {
      if (link.sheet) { resolve(); return; }
      link.addEventListener('load', resolve, { once: true });
      link.addEventListener('error', resolve, { once: true });
    });
  }
  var fontLinks = Array.prototype.slice.call(document.querySelectorAll('link.gfont-link'));
  var linksReady = fontLinks.length ? Promise.all(fontLinks.map(waitForLinkLoad)) : Promise.resolve();
  var fontsApiReady = ('fonts' in document) ? document.fonts.ready : Promise.resolve();
  var ready = linksReady.then(function () { return fontsApiReady; });
  Promise.race([
    ready,
    new Promise(function (resolve) { setTimeout(resolve, 800); })
  ]).then(reveal);
  setTimeout(reveal, 1500);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>기도 요청</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link class="gfont-link" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/css/style.css" />
<!--FONT_STYLE_TAG-->

<!-- PWA: 홈 화면에 추가했을 때 앱처럼 보이도록 하는 설정 -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0d1526" />
<link rel="icon" href="/icons/icon-192-v2.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body data-api-base="prayers">

<header class="site-header scrolled">
  <div class="container">
    <a href="/" class="brand" id="board-brand">물댄동산교회</a>
  </div>
</header>

<main>
  <section class="section receipt-page-section">
    <div class="container receipt-page-container">

      <a href="/#offering-prayer-section" class="qt-back-link">← 헌금안내·기도요청으로</a>

      <div class="section-head" style="text-align:left; margin-bottom:28px;">
        <span class="eyebrow">PRAYER REQUEST</span>
        <h2>기도 요청</h2>
        <p>함께 기도할 제목을 나눠주세요. 비밀글로 남기면 목회자만 확인할 수 있어요.</p>
      </div>

      <form class="prayer-form" id="board-form">
        <div class="prayer-form-row">
          <input type="text" id="board-name" placeholder="이름 또는 닉네임 (선택)" maxlength="30" />
          <label class="prayer-secret-toggle">
            <input type="checkbox" id="board-secret" />
            비밀글로 남기기
          </label>
        </div>
        <input type="password" id="board-password" class="prayer-password-input" placeholder="비밀번호 (4자 이상, 나중에 내용 확인할 때 필요해요)" style="display:none;" />
        <textarea id="board-content" rows="4" placeholder="기도 제목을 나눠주세요" maxlength="2000" required></textarea>
        <div class="prayer-form-foot">
          <span class="prayer-form-status" id="board-form-status"></span>
          <button type="submit" class="btn btn--gold">기도 요청 남기기</button>
        </div>
      </form>

      <div class="prayer-list" id="board-list"></div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="board-year"></span> <span id="board-footer-name">물댄동산교회</span>. All rights reserved.</p>
  </div>
</footer>

<script src="/js/secret-board.js"></script>
</body>
</html>
