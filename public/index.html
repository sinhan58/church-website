<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">교회 홈페이지</title>
<meta name="description" content="교회 소개, 예배 안내, 설교 영상, 소식과 활동을 만나보세요." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header" id="site-header">
  <div class="container">
    <a href="#home" class="brand" id="brand-name">교회<span class="gold-dot">.</span></a>
    <nav class="nav-desktop" id="nav-desktop"></nav>
    <button class="hamburger" id="hamburger" aria-label="메뉴 열기">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<nav class="nav-mobile" id="nav-mobile"></nav>

<main>

  <!-- HERO -->
  <section class="hero" id="home">
    <div class="hero-inner">
      <div class="verse-card">
        <p class="verse-text" id="hero-verse">말씀을 불러오는 중입니다...</p>
        <p class="verse-ref" id="hero-verse-ref"></p>
      </div>
      <p class="hero-subtitle" id="hero-subtitle"></p>
      <div class="hero-cta">
        <a href="#service" class="btn btn--gold">예배 시간 안내</a>
        <a href="#sermons" class="btn btn--outline">설교 영상 보기</a>
      </div>
    </div>
    <span class="scroll-cue">SCROLL</span>
  </section>

  <!-- ABOUT -->
  <section class="section" id="about">
    <div class="container about-grid">
      <img id="about-image" src="/uploads/about-default.svg" alt="교회 사진" />
      <div class="about-body">
        <span class="eyebrow">ABOUT US</span>
        <h2 id="about-greeting">교회 소개</h2>
        <p id="about-body-text"></p>
        <p id="about-history" style="color:var(--muted); font-size:0.92rem;"></p>
        <div class="pastor-box">
          <p class="name" id="pastor-name"></p>
          <p id="pastor-message"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- SERVICE TIMES -->
  <section class="section section--dark" id="service">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">SERVICE TIMES</span>
        <h2>예배 안내</h2>
        <p>언제든 편안한 마음으로 함께 예배드려요</p>
      </div>
      <div class="service-grid" id="service-grid"></div>
    </div>
  </section>

  <!-- SERMONS (YouTube 자동 업데이트) -->
  <section class="section" id="sermons">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">SERMONS</span>
        <h2>설교 영상</h2>
        <p>매주 유튜브 채널에 올라오는 설교 영상이 자동으로 갱신됩니다</p>
      </div>
      <p class="sermon-updated" id="sermon-updated"></p>
      <div class="sermon-grid" id="sermon-grid"></div>
    </div>
  </section>

  <!-- BOARD (소식·활동) -->
  <section class="section section--tight" id="board" style="background:var(--ivory-dim);">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">NEWS &amp; ACTIVITIES</span>
        <h2>소식 · 활동</h2>
        <p>교회의 다양한 소식과 활동을 전해드립니다</p>
      </div>
      <div class="board-tabs" id="board-tabs">
        <button class="board-tab active" data-cat="전체">전체</button>
        <button class="board-tab" data-cat="소식">소식</button>
        <button class="board-tab" data-cat="활동">활동</button>
      </div>
      <div class="board-list" id="board-list"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="section" id="contact">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">CONTACT</span>
        <h2>오시는 길</h2>
      </div>
      <div class="contact-grid">
        <dl class="contact-info">
          <dt>주소</dt><dd id="contact-address"></dd>
          <dt>전화</dt><dd id="contact-phone"></dd>
          <dt>이메일</dt><dd id="contact-email"></dd>
        </dl>
        <div class="map-box" id="map-box">
          <div class="map-placeholder">지도가 아직 등록되지 않았습니다</div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-top">
      <span class="footer-brand" id="footer-brand"></span>
      <div class="footer-sns" id="footer-sns"></div>
    </div>
    <p>&copy; <span id="footer-year"></span> <span id="footer-brand-2"></span>. All rights reserved. &nbsp;·&nbsp; <a class="admin-link" href="/admin">관리자</a></p>
  </div>
</footer>

<!-- 영상 재생 모달 -->
<div class="video-modal" id="video-modal">
  <div class="video-modal-inner">
    <button class="video-modal-close" id="video-modal-close" aria-label="닫기">&times;</button>
    <div id="video-modal-frame"></div>
  </div>
</div>

<script src="/js/main.js"></script>
</body>
</html>
