<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<script>if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }</script>
<!-- 글씨체 준비될 때까지 잠깐 화면 숨기기 (최대 0.8초) -->
<script>document.documentElement.classList.add('fonts-loading');</script>
<style>
  html.fonts-loading body { opacity: 0; }
  body { transition: opacity 0.25s ease; }
</style>
<script>
(function () {
  var done = false;
  function reveal() {
    if (done) return;
    done = true;
    document.documentElement.classList.remove('fonts-loading');
  }
  function waitForLinkLoad(link) {
    return new Promise(function (resolve) {
      if (link.sheet) { resolve(); return; }
      link.addEventListener('load', resolve, { once: true });
      link.addEventListener('error', resolve, { once: true });
    });
  }
  var fontLinks = Array.prototype.slice.call(document.querySelectorAll('link.gfont-link'));
  var linksReady = fontLinks.length ? Promise.all(fontLinks.map(waitForLinkLoad)) : Promise.resolve();
  var fontsApiReady = ('fonts' in document) ? document.fonts.ready : Promise.resolve();
  var ready = linksReady.then(function () { return fontsApiReady; });
  Promise.race([
    ready,
    new Promise(function (resolve) { setTimeout(resolve, 800); })
  ]).then(reveal);
  setTimeout(reveal, 1500);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이번 주 말씀 퀴즈</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link class="gfont-link" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/css/style.css" />
<!--FONT_STYLE_TAG-->

<!-- PWA: 홈 화면에 추가했을 때 앱처럼 보이도록 하는 설정 -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0d1526" />
<link rel="icon" href="/icons/icon-192-v2.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
  /* ---------------- 말씀 퀴즈 전용 스타일 ---------------- */
  .quiz-page-section { padding: 64px 0 96px; }
  .quiz-page-container { max-width: 1080px; }

  .quiz-layout { display: grid; grid-template-columns: 1fr 260px; gap: 32px; align-items: start; }
  @media (max-width: 860px) { .quiz-layout { grid-template-columns: 1fr; } }

  /* 본문 읽기 단계에서는 옆의 참여자 순위 칸을 잠깐 숨기고, 말씀 박스가 화면 폭을
     훨씬 넉넉하게 쓰도록 합니다 (본문이 길 때 특히 읽기 편하도록). 풀이 단계로
     넘어가면 다시 원래의 2단 배치로 돌아옵니다. */
  .quiz-layout.reading-stage { grid-template-columns: 1fr; }
  .quiz-layout.reading-stage .quiz-side-card { display: none; }

  /* 페이지 내용이 화면보다 짧아도 하단 남색 푸터가 화면 맨 아래에 붙어있도록 고정합니다. */
  body { display: flex; flex-direction: column; min-height: 100vh; }
  main { flex: 1 0 auto; }
  .site-footer { flex-shrink: 0; }

  .quiz-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
  }
  .quiz-ref { font-family: var(--font-heading); font-size: 1.3rem; color: var(--navy-deep); margin: 0 0 4px; }
  .quiz-week-label { color: var(--muted); font-size: 0.85rem; margin: 0 0 24px; }

  .quiz-name-field {
    margin-bottom: 22px;
    padding: 16px;
    background: var(--ivory-dim);
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .quiz-name-field input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 1rem; font-family: inherit; box-sizing: border-box; background: #fff;
  }
  .quiz-name-field input:disabled { background: #f0ede3; color: var(--muted); }
  .quiz-name-notice { margin: 8px 0 0; font-size: 0.82rem; color: #b3413a; min-height: 1.2em; }

  .quiz-read-text { line-height: 2; font-size: 1.05rem; word-break: keep-all; color: var(--ink); }
  .quiz-read-verse { margin-bottom: 14px; }
  .quiz-read-verse .num { color: var(--gold-deep); font-weight: 700; margin-right: 6px; }

  .quiz-progress { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }

  .quiz-verse-text { line-height: 2.6; font-size: 1.08rem; word-break: keep-all; color: var(--ink); margin-bottom: 22px; }

  .quiz-blank-choices {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 4px 4px;
    vertical-align: middle;
  }
  .quiz-choice-btn {
    padding: 6px 14px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.92rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .quiz-choice-btn:hover:not(:disabled) { border-color: var(--gold); background: var(--ivory-dim); }
  .quiz-choice-btn.selected { border-color: var(--gold); background: var(--gold-soft); font-weight: 700; }
  .quiz-choice-btn:disabled { cursor: default; }
  .quiz-choice-btn.correct-pick { border-color: #2f6d3a; background: #eaf5ec; color: #2f6d3a; font-weight: 700; }
  .quiz-choice-btn.wrong-pick { border-color: #b3413a; background: #fbeceb; color: #b3413a; text-decoration: line-through; }
  /* 선택 안 한 나머지 보기들은 채점 후 옅게 처리 */
  .quiz-blank-choices.locked .quiz-choice-btn:not(.selected) { opacity: 0.45; }

  .quiz-blank-retry-row {
    display: flex; gap: 8px;
  }
  .quiz-blank-retry-row button {
    font-size: 0.82rem; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer;
  }
  .quiz-blank-retry-row button.hint-btn { border-color: var(--gold); color: #96780f; }
  .quiz-blank-retry-row button:hover { background: var(--ivory-dim); }

  .quiz-hint-box {
    display: none;
    margin: 10px 0 18px;
    padding: 12px 14px;
    background: var(--ivory-dim);
    border-left: 3px solid var(--gold);
    border-radius: 6px;
    font-size: 0.92rem;
    color: var(--muted);
    line-height: 1.7;
  }
  .quiz-hint-box.open { display: block; }

  .quiz-verse-feedback { font-size: 0.88rem; margin-bottom: 16px; min-height: 1.2em; }
  .quiz-verse-feedback.ok { color: #2f6d3a; }
  .quiz-verse-feedback.retry { color: var(--gold-deep); }

  .quiz-result-score { text-align: center; padding: 20px 0 10px; }
  .quiz-result-score .num { font-size: 3rem; font-weight: 800; color: var(--navy-deep); }
  .quiz-result-badge {
    display: inline-block; margin-top: 10px; padding: 8px 20px; border-radius: 999px;
    font-weight: 700; font-size: 1rem; background: var(--gold-soft); color: var(--navy-deep);
  }

  .quiz-side-card {
    background: var(--ivory-dim);
    border-radius: var(--radius);
    padding: 22px;
  }
  .quiz-side-card h3 { font-size: 0.95rem; margin: 0 0 14px; color: var(--navy-deep); }
  .quiz-leaderboard { display: flex; flex-direction: column; gap: 8px; }
  .quiz-leaderboard-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px;
    font-size: 0.88rem;
  }
  .quiz-leaderboard-row .rank { color: var(--gold-deep); font-weight: 700; width: 22px; }
  .quiz-leaderboard-row .name { flex: 1; }
  .quiz-leaderboard-row .score { font-weight: 700; color: var(--navy-deep); }
  .quiz-empty { color: var(--muted); font-size: 0.88rem; }

  .quiz-btn-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
</style>
</head>
<body>

<header class="site-header scrolled">
  <div class="container">
    <a href="/" class="brand" id="quiz-brand">물댄동산교회</a>
  </div>
</header>

<main class="page-enter">
  <section class="section quiz-page-section">
    <div class="container quiz-page-container">

      
      <div class="section-head" style="text-align:left; margin-bottom:28px;">
        <span class="eyebrow">BIBLE QUIZ</span>
        <h2>이번 주 말씀 퀴즈</h2>
        <p>먼저 말씀을 천천히 읽어보시고, 준비되시면 빈칸 채우기에 도전해보세요.</p>
      </div>

      <div class="quiz-layout">
        <div id="quiz-main">
          <div class="quiz-card">
            <p class="quiz-empty">불러오는 중...</p>
          </div>
        </div>

        <aside class="quiz-side-card">
          <h3>이번 주 참여자</h3>
          <div class="quiz-leaderboard" id="quiz-leaderboard">
            <p class="quiz-empty">아직 참여자가 없어요.</p>
          </div>
        </aside>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="quiz-year"></span> <span id="quiz-footer-name">물댄동산교회</span>. All rights reserved.</p>
  </div>
</footer>

<script src="/js/quiz.js"></script>
</body>
</html>
