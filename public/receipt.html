<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>기부금 영수증 신청</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header scrolled">
  <div class="container">
    <a href="/" class="brand" id="receipt-brand">물댄동산교회</a>
  </div>
</header>

<main>
  <section class="section receipt-page-section">
    <div class="container receipt-page-container">

      <a href="/#offering" class="qt-back-link">← 헌금 안내로</a>

      <div class="section-head" style="text-align:left; margin-bottom:28px;">
        <span class="eyebrow">RECEIPT</span>
        <h2>기부금 영수증 신청</h2>
        <p>연말정산용 기부금 영수증이 필요하시면 아래 정보를 남겨주세요. 확인 후 개별 연락드립니다.</p>
      </div>

      <div class="offering-card" style="text-align:left; margin:0 0 24px;">
        <h3 style="font-size:0.98rem; margin:0 0 10px; color:var(--navy-deep);">영수증 발급을 위해 이런 정보가 필요해요</h3>
        <ul class="receipt-info-list">
          <li>신청자 성명 (실명)</li>
          <li>생년월일</li>
          <li>수령 방법 (홈택스, 이메일, 우편, 문자 등)</li>
          <li>신청 연도</li>
        </ul>
        <p class="receipt-privacy-note">주민등록번호처럼 민감한 정보는 이 폼에 남기지 마시고, 아래 참고사항에 "전화로 알려드리겠습니다"라고 남겨주시면 저희가 별도로 안전하게 연락드릴게요.</p>
      </div>

      <div class="offering-card" style="text-align:left;">
        <form id="receipt-form">
          <div class="offering-receipt-row">
            <input type="text" id="receipt-name" placeholder="이름" required />
            <input type="text" id="receipt-phone" placeholder="연락처" required />
          </div>
          <input type="email" id="receipt-email" placeholder="이메일 (선택)" />
          <textarea id="receipt-note" placeholder="참고사항 (예: 생년월일, 수령 방법(전자, 이메일, 우편, 문자 등), 신청 연도 등)" rows="4"></textarea>
          <button type="submit" class="btn-gold">신청하기</button>
          <p class="offering-receipt-status" id="receipt-status"></p>
        </form>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="receipt-year"></span> <span id="receipt-footer-name">물댄동산교회</span>. All rights reserved.</p>
  </div>
</footer>

<script src="/js/receipt.js"></script>
</body>
</html>
