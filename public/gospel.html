<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<script>if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }</script>
<!-- 글씨체 준비될 때까지 잠깐 화면 숨기기 (최대 0.8초) -->
<script>document.documentElement.classList.add('fonts-loading');</script>
<style>
  html.fonts-loading body { opacity: 0; }
  body { transition: opacity 0.25s ease; }
</style>
<script>
(function () {
  var done = false;
  function reveal() {
    if (done) return;
    done = true;
    document.documentElement.classList.remove('fonts-loading');
  }
  function waitForLinkLoad(link) {
    return new Promise(function (resolve) {
      if (link.sheet) { resolve(); return; }
      link.addEventListener('load', resolve, { once: true });
      link.addEventListener('error', resolve, { once: true });
    });
  }
  var fontLinks = Array.prototype.slice.call(document.querySelectorAll('link.gfont-link'));
  var linksReady = fontLinks.length ? Promise.all(fontLinks.map(waitForLinkLoad)) : Promise.resolve();
  var fontsApiReady = ('fonts' in document) ? document.fonts.ready : Promise.resolve();
  var ready = linksReady.then(function () { return fontsApiReady; });
  Promise.race([
    ready,
    new Promise(function (resolve) { setTimeout(resolve, 800); })
  ]).then(reveal);
  setTimeout(reveal, 1500);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>교회가 되십시오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link class="gfont-link" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/css/style.css" />
<!--FONT_STYLE_TAG-->

<!-- PWA: 홈 화면에 추가했을 때 앱처럼 보이도록 하는 설정 -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0d1526" />
<link rel="icon" href="/icons/icon-192-v2.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
  .gospel-section { padding: 64px 0 96px; }
  .gospel-container { max-width: 720px; }
  .gospel-content {
    font-size: 1.02rem;
    line-height: 1.9;
    color: var(--ink);
    word-break: keep-all;
    overflow-wrap: break-word;
    margin-top: 8px;
  }
  .gospel-content p { margin: 0 0 20px; }
  .gospel-content img {
    max-width: 100%;
    height: auto;
    border-radius: var(--radius);
    margin: 8px 0 24px;
    display: block;
  }
  .gospel-content h1, .gospel-content h2, .gospel-content h3 {
    font-family: var(--font-heading);
    color: var(--navy-deep);
    line-height: 1.4;
    margin: 36px 0 14px;
  }
  .gospel-content h1:first-child, .gospel-content h2:first-child, .gospel-content h3:first-child { margin-top: 0; }
  .gospel-content blockquote {
    border-left: 4px solid var(--gold-deep);
    background: var(--ivory-dim);
    padding: 16px 20px;
    margin: 20px 0;
    color: var(--navy-deep);
    font-family: var(--font-heading);
  }
  .gospel-content ul, .gospel-content ol { padding-left: 22px; margin: 0 0 20px; }
  .gospel-content li { margin-bottom: 6px; }
  .gospel-empty { color: var(--muted); font-size: 0.92rem; }
  .gospel-cta-row { margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header class="site-header scrolled">
  <div class="container">
    <a href="/" class="brand" id="gospel-brand">물댄동산교회</a>
  </div>
</header>

<main class="page-enter">
  <section class="section gospel-section">
    <div class="container gospel-container">

      <a href="/new-family.html" class="qt-back-link">← 새가족 메시지로</a>

      <div class="section-head" style="text-align:left; margin-bottom:12px;">
        <span class="eyebrow">GOOD NEWS</span>
        <h2>교회가 되십시오</h2>
      </div>

      <div class="gospel-content" id="gospel-content">
        <p class="gospel-empty">내용을 불러오는 중...</p>
      </div>

      <div class="gospel-cta-row">
        <a href="/inquiry.html" class="btn btn--gold">온라인 문의하기</a>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="gospel-year"></span> <span id="gospel-footer-name">물댄동산교회</span>. All rights reserved.</p>
  </div>
</footer>

<script>
  document.getElementById('gospel-year').textContent = new Date().getFullYear();
  fetch('/api/site')
    .then((res) => res.json())
    .then((site) => {
      if (!site) return;
      if (site.churchName) {
        document.getElementById('gospel-brand').textContent = site.churchName;
        document.getElementById('gospel-footer-name').textContent = site.churchName;
      }
      const html = site.newFamily && site.newFamily.gospelHtml;
      const target = document.getElementById('gospel-content');
      if (html && html.trim()) {
        target.innerHTML = html;
      } else {
        target.innerHTML = '<p class="gospel-empty">아직 등록된 내용이 없습니다.</p>';
      }
    })
    .catch(() => {
      document.getElementById('gospel-content').innerHTML = '<p class="gospel-empty">내용을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p>';
    });
</script>
</body>
</html>
